<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emerald Oryn - Solusi Digital All-in-One</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #0A0A0F; --bg2: #101018; --emerald: #2EE59D; --emerald-bright: #00FF88;
  --purple: #A855F7; --cyan: #00D4FF; --text: #FFFFFF; --text-muted: #B0B0C0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;background-image:linear-gradient(rgba(46,229,157,0.03) 1px, transparent 1px),linear-gradient(90deg, rgba(46,229,157,0.03) 1px, transparent 1px);background-size:40px 40px;opacity:1;transition:opacity 0.4s ease}
body.fade-out{opacity:0}
body.no-scroll{overflow:hidden}
h1,h2,h3{font-family:'Orbitron',sans-serif}
.container{max-width:1200px;margin:0 auto;padding:0 20px}

/* NAV + HAMBURGER FIX */
nav{position:fixed;top:0;left:0;width:100%;z-index:1000;backdrop-filter:blur(12px);background:rgba(10,10,15,0.85);border-bottom:1px solid rgba(46,229,157,0.1)}
nav .container{display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
.logo{font-family:'Orbitron';font-size:20px;font-weight:800;color:var(--emerald);text-shadow:0 0 10px var(--emerald)}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-links a{color:var(--text-muted);text-decoration:none;font-weight:500;transition:0.3s}
.nav-links a:hover{color:var(--emerald)}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;z-index:1001}
.hamburger span{width:25px;height:3px;background:var(--emerald);transition:0.3s;border-radius:2px}

.btn{padding:12px 24px;border-radius:12px;border:1px solid var(--emerald);background:transparent;color:var(--emerald);font-weight:600;cursor:pointer;transition:all 0.3s;box-shadow:0 0 15px rgba(46,229,157,0.2);text-decoration:none;display:inline-block}
.btn:hover{background:var(--emerald);color:var(--bg);box-shadow:0 0 25px var(--emerald-bright);transform:translateY(-2px)}
.btn-primary{background:linear-gradient(90deg,var(--emerald),var(--cyan));color:var(--bg);border:none}

/* HERO */
.hero{padding:140px 0 100px 0;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;min-height:80vh}
.hero h1{font-size:56px;line-height:1.1;margin-bottom:16px;background:linear-gradient(90deg,var(--emerald),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:left}
.hero p{color:var(--text-muted);font-size:18px;margin-bottom:24px;text-align:left}
.hero-cta{display:flex;gap:16px;flex-wrap:wrap}
.hero-img{position:relative}
.hero-img .glow{position:absolute;inset:-20px;background:radial-gradient(circle, rgba(46,229,157,0.3) 0%, transparent 70%);filter:blur(40px);z-index:-1}
.phone-mock{width:100%;border-radius:24px;border:1px solid rgba(46,229,157,0.3);box-shadow:0 0 40px rgba(0,212,255,0.2)}

footer{padding:40px 0;border-top:1px solid rgba(46,229,157,0.1);text-align:center;color:var(--text-muted);margin-top:60px}

/* RESPONSIVE */
@media(max-width:900px){
  .hero{grid-template-columns:1fr;text-align:center;padding-top:120px}
  .hero h1, .hero p{text-align:center}
  .hero-cta{justify-content:center}
  .nav-links{position:fixed;top:0;right:-100%;flex-direction:column;background:var(--bg2);width:75%;height:100vh;padding:80px 20px;border-left:1px solid rgba(46,229,157,0.1);transition:0.4s;align-items:flex-start}
  .nav-links.active{right:0}
  .hamburger{display:flex}
}
</style>
</head>
<body>

<nav>
  <div class="container">
    <div class="logo">EMERALD ORYN</div>
    <div class="nav-links" id="navLinks">
      <a href="index.html" class="page-link">Beranda</a>
      <a href="Pages/Produk.html" class="page-link">Produk</a>
      <a href="Pages/Digital.html" class="page-link">Keunggulan</a>
      <a href="Pages/Digital.html#faq" class="page-link">FAQ</a>
      <a href="https://wa.me/6285817842440?text=Halo+Admin+Emerald+Oryn+saya+mau+tanya" target="_blank">💬 Chat Admin</a>
    </div>
    <div class="hamburger" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </div>
  </div>
</nav>

<section class="hero container">
  <div>
    <h1>EMERALD ORYN</h1>
    <p>Menjual Kebutuhan Digital Bagi Creator, Gamer Dan Lainnya</p>
    <div class="hero-cta">
      <a href="Pages/Produk.html" class="btn btn-primary page-link">🛒 Lihat Produk</a>
      <a href="Pages/Digital.html" class="btn page-link">⚡ Kenapa Kami</a>
    </div>
  </div>
  <div class="hero-img">
    <div class="glow"></div>
    <img src="https://via.placeholder.com/500x500/101018/2EE59D?text=Digital+Assets" alt="Produk Digital" class="phone-mock">
  </div>
</section>

<footer>
  <div class="container">
    <div class="logo">EMERALD ORYN</div>
    <p>Emerald Oryn — Your Digital Asset Solution</p>
    <p>© 2026 Emerald Oryn. All rights reserved.</p>
  </div>
</footer>

<script>
function toggleMenu(){
  document.getElementById('navLinks').classList.toggle('active')
  document.body.classList.toggle('no-scroll')
}

// Animasi pindah halaman
document.querySelectorAll('.page-link').forEach(link=>{
  link.addEventListener('click', function(e){
    if(this.target === '_blank') return;
    e.preventDefault();
    const href = this.getAttribute('href');
    document.body.classList.add('fade-out');
    setTimeout(()=>{ window.location.href = href }, 400);
  })
})

// Tutup menu pas klik link
document.querySelectorAll('.nav-links a').forEach(link=>{
  link.addEventListener('click', ()=>{
    document.getElementById('navLinks').classList.remove('active')
    document.body.classList.remove('no-scroll')
  })
})
</script>
</body>
</html>
